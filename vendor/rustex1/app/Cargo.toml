[package]
name = "rustex1-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The rustex1 demo frontend: shows what the kit gives you (HMR telemetry panels, widgets, routes) built entirely from Rust."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustex1-kit = { path = "../kit" }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
